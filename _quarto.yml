project:
  type: book
  output-dir: docs

engines: ["julia"]

execute:
  freeze: auto

book:
  title: "Geoscientific Machine Learning"
  author: "Pankaj K Mishra"
  site-url: "https://geo-sciml.com/"
  output-file: "geo-sciml"
  downloads: [pdf]
  search: true
  sidebar:
    style: docked
    collapse-level: 1
    tools:
      - icon: github
        href: https://github.com/pankajkmishra/geo-sciml
  page-navigation: true
  chapters:
    - text: "About this book"
      file: index.md
    - chapters/01-getting-started-julia.qmd
    - text: "Files & Data Manipulation"
      file: chapters/02-files-data.qmd
    - chapters/03-plotting-maps.qmd
    - chapters/04-neural-networks.qmd
    - chapters/05-inverse-modeling.qmd
    - chapters/06-ai-surrogates.qmd
    - chapters/07-applications.qmd

format:
  html:
    title-block-banner: false
    theme:
      light: cosmo
    css: styles.css
    toc: true
    toc-title: "Contents"
    toc-depth: 3
    toc-location: right
    number-sections: true
    code-link: true
    code-copy: true
    code-overflow: wrap
    code-block-bg: "#f8f9fa"
    code-block-border-left: "#088F8F"  # left border color
    highlight-style: github
    grid:
      sidebar-width: 400px
      body-width: 1000px
      margin-width: 200px
      gutter-width: 1.5em
  pdf:
    number-sections: true
    number-depth: 3
    toc: true
    toc-depth: 3
    toc-title: "Table of Contents"
    colorlinks: true
    linkcolor: blue
    toccolor: blue
    urlcolor: blue
    citecolor: blue
    mainfont: "Libertinus Serif"
    sansfont: "Libertinus Sans"
    monofont: "JuliaMono"
    mathfont: "Libertinus Math"
    highlight-style: github
    code-block-bg: false
    header-includes: |
      \usepackage{fancyhdr}
      \pagestyle{fancy}
      \setcounter{secnumdepth}{3}
      \renewcommand{\chaptermark}[1]{\markboth{\textit{#1}}{}}
      \renewcommand{\sectionmark}[1]{\markright{\textit{#1}}}
      \fancyhead[LE,RO]{\textit{\nouppercase{\rightmark}}}
      \fancyhead[LO,RE]{\textit{\nouppercase{\leftmark}}}
      \usepackage{etoolbox}
      \AtBeginEnvironment{Highlighting}{\color[RGB]{30,30,30}}
      \usepackage{tcolorbox}
      \tcbuselibrary{breakable,skins}
      \definecolor{codebg}{RGB}{245,245,245}
      \definecolor{codeborder}{RGB}{0,51,153}
      \renewenvironment{Shaded}{
      \begin{NoHyper}\begin{tcolorbox}[enhanced,breakable,colback=codebg,colframe=codeborder,boxrule=0pt,leftrule=1pt,rightrule=0pt,arc=1.5pt,outer arc=1.5pt,left=8pt,right=8pt,top=6pt,bottom=3pt]}{\end{tcolorbox}\end{NoHyper}
      }
