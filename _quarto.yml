project:
  type: book
  output-dir: docs
  resources:
    - 404.html
  post-render:
    - python _scripts/inline-js.py

engines: ["julia"]

execute:
  freeze: auto
  fig-format: png

bibliography: references.bib
csl: https://raw.githubusercontent.com/citation-style-language/styles/master/apa.csl
link-citations: true
link-bibliography: true
description: "Geoscientific machine learning with Julia: tutorials, methods, and applications in geophysics, inverse problems, and scientific ML."

book:
  title: "Geoscientific Machine Learning"
  subtitle: "[https://geo-sciml.com](https://geo-sciml.com)"
  author: "Pankaj K Mishra"
  site-url: "https://geo-sciml.com/"
  output-file: "geo-sciml"
  downloads: [pdf]
  search: true
  repo-url: https://github.com/pankajkmishra/geo-sciml
  repo-branch: main
  repo-actions: [edit, issue]
  sidebar:
    style: docked
    collapse-level: 1
  page-navigation: true
  chapters:
    - index.md

    - part: "Julia Programming for Geoscience"
      chapters:
        - chapters/01-getting-started-julia.qmd
        - chapters/02-files-data.qmd
        - chapters/03-plotting-maps.qmd

    - part: "Neural Networks"
      chapters:
        - chapters/04a-nn-teaser.qmd
        - chapters/04b-nn-basics.qmd
        - chapters/04c-feedforward.qmd
        - chapters/04d-cnn.qmd
        - chapters/04e-rnn.qmd
        - chapters/04f-transformers.qmd
        - chapters/04g-autoencoders.qmd
        - chapters/04h-gan.qmd
        - chapters/04i-gnn.qmd

    - part: "Scientific Machine Learning"
      chapters:
        - chapters/05a-pinn.qmd
        - chapters/05b-physics-ml-inversion.qmd
        - chapters/05c-deeponet.qmd
        - chapters/05d-pi-deeponet.qmd
        - chapters/05e-fno.qmd

    - part: "Applications"
      chapters:
        - chapters/06-applications.qmd

    - references.qmd

format:
  html:
    include-in-header: _includes/citation-meta.html
    theme:
      light: [cosmo, styles.scss]
    open-graph: true
    twitter-card: true
    code-link: true
    code-copy: true
    code-overflow: wrap
    code-block-border-left: "#088F8F"
    code-block-bg: true
    code-block-border: true
    code-block-border-radius: 5pt
    highlight-style: github
    callout-appearance: simple
    grid:
      sidebar-width: 480px
      body-width: 800px
      margin-width: 250px
      gutter-width: 2.5em
    
  pdf:
    include-before-body: _includes/abstract.tex
    number-sections: true
    number-depth: 2
    toc: true
    toc-depth: 2
    toc-title: "Table of Contents"
    fig-width: 6
    fig-height: 4
    out-width: "100%"
    colorlinks: true
    linkcolor: blue
    toccolor: blue
    urlcolor: blue
    citecolor: blue
    mainfont: "Libertinus Serif"
    sansfont: "Libertinus Sans"
    monofont: "JuliaMono"
    mathfont: "Libertinus Math"
    geometry:
      - top=1in
      - bottom=1in
      - inner=0.75in
      - outer=1.25in
      - twoside
    code-block-bg: false
    header-includes: |
      \usepackage{fancyhdr}
      \pagestyle{fancy}
      \fancyfoot[C]{}
      \fancypagestyle{plain}{%
        \fancyhf{}
        \renewcommand{\headrulewidth}{0pt}
      }
      \setcounter{secnumdepth}{3}
      \renewcommand{\chaptermark}[1]{\markboth{\textit{#1}}{}}
      \renewcommand{\sectionmark}[1]{\markright{\textit{#1}}}
      \fancyhead[LE,RO]{\textit{\nouppercase{\rightmark}}}
      \fancyhead[LO,RE]{\textit{\nouppercase{\leftmark}}}
      \AtBeginEnvironment{figure}{\centering}
      \AtBeginEnvironment{Highlighting}{\color[RGB]{30,30,30}}
      \usepackage{tcolorbox}
      \tcbuselibrary{breakable,skins}
      \definecolor{codebg}{RGB}{245,245,245}
      \definecolor{codeborder}{RGB}{0,51,153}
      \renewenvironment{Shaded}{
      \begin{NoHyper}\begin{tcolorbox}[enhanced,breakable,colback=codebg,colframe=codeborder,boxrule=0pt,leftrule=1pt,rightrule=0pt,arc=1.5pt,outer arc=1.5pt,left=8pt,right=8pt,top=6pt,bottom=3pt]}{\end{tcolorbox}\end{NoHyper}
      }
