project:
  type: book
  output-dir: docs

engines: ["julia"]

execute:
  freeze: auto

book:
  title: "Geoscientific Machine Learning"
  author: "Pankaj K Mishra"
  site-url: "https://geo-sciml.com/"
  output-file: "geo-sciml"
  downloads: [pdf]
  search: true
  sidebar:
    style: docked
    collapse-level: 1
    tools:
      - icon: github
        href: https://github.com/pankajkmishra/geo-sciml
  page-navigation: true
  chapters:
    - text: "About this book"
      file: index.md
    - chapters/01-getting-started-julia.qmd
    - text: "Files & Data Manipulation"
      file: chapters/02-files-data.qmd
    - chapters/03-plotting-maps.qmd
    - chapters/04-neural-networks.qmd
    - chapters/05-inverse-modeling.qmd
    - chapters/06-ai-surrogates.qmd
    - chapters/07-applications.qmd

format:
  html:
    title-block-banner: false
    theme:
      light: cosmo
    css: styles.css
    toc: true
    toc-title: "Contents"
    toc-depth: 3
    toc-location: right
    number-sections: true
    code-link: true
    code-copy: true
    code-overflow: wrap
    grid:
      sidebar-width: 450px
      body-width: 1200px
      margin-width: 300px
      gutter-width: 1.5em
  pdf:
    number-sections: true
    number-depth: 3
    toc: true
    toc-depth: 3
    toc-title: "Table of Contents"
    colorlinks: true
    linkcolor: blue
    toccolor: blue
    urlcolor: blue
    citecolor: blue
    mainfont: "Libertinus Serif"
    sansfont: "Libertinus Sans"
    monofont: "JuliaMono"
    mathfont: "Libertinus Math"
    header-includes: |
      \usepackage{fancyhdr}
      \pagestyle{fancy}
      \setcounter{secnumdepth}{3}
